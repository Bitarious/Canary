  validation:
    buckets: [60, 75]
    start: '2022-01-01T00:00:00+00:00'
    stop: '2022-04-01T00:00:00+00:00'
  calibration:
    buckets: [75, 85]
    start: '2022-04-01T00:00:00+00:00'
    stop: '2022-07-01T00:00:00+00:00'
  test:
    buckets: [85, 100]
    start: '2022-07-01T00:00:00+00:00'
    stop: '2022-10-01T00:00:00+00:00'
host_limits:
  train: 400
  validation: 128
  calibration: 64
  test: 128
windows_per_module:
  train: 128
  validation: 8
  calibration: 8
  test: 8
channels:
  rotor_0_speed:
    unit: rpm
    description: first rotor speed in the fan module, in revolutions per minute
