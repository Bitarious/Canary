version: component-v1
component: fan
scope: Describe observed fan-module speed patterns. No fan failure or maintenance-benefit prediction.
split_salt: 'driftops-m100-fan-host-v1:'
provider: CINECA Marconi100 / ExaData
source_type: m100-ipmi-fan-module-speeds
source_url: https://zenodo.org/records/7541722
license: CC-BY-4.0
license_url: https://creativecommons.org/licenses/by/4.0/
citation: M100 ExaData node-aggregated IPMI observations, pinned Zenodo record 7541722
cadence_us: 900000000
cadence_text: fifteen-minute mean fan speeds available at interval end
availability: The publisher uses left-labeled fifteen-minute bins. Add fifteen minutes before model availability. Exclude the schema-probe rack and all Nagios labels. Group all four fan modules by host.
