name: Pilot verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.13
      - run: uv sync --locked --extra model-access
      - run: uv run --no-sync driftops prepare
      - run: uv run --no-sync pytest -q
